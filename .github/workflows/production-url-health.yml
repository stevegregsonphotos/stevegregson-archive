name: Production URL Health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

jobs:
  production-url-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out website-redesign
        uses: actions/checkout@v4
        with:
          ref: website-redesign

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production URL health
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/check-production-url-health.mjs
